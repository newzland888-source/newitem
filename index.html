<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>อัพเดตราคาไอเทมเกม - Game Price Tracker</title>
  <!-- ดึง Tailwind CSS มาใช้แต่งหน้าตาเว็บ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- ฟอนต์ภาษาไทย Prompt -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">

  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    <header class="text-center my-8">
      <h1 class="text-4xl font-bold text-amber-400 mb-2">🎮 ตารางอัพเดตราคาไอเทมในเกม</h1>
      <p class="text-slate-400">เช็คราคากลาง และแนวโน้มตลาดล่าสุด</p>
    </header>

    <!-- Search & Filter -->
    <div class="mb-8 flex flex-col md:flex-row gap-4 justify-between">
      <input type="text" placeholder="ค้นหาชื่อไอเทม..." class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-amber-400 w-full md:w-1/3">
      <select class="px-4 py-2 bg-slate-800 border border-slate-700 rounded-lg text-white focus:outline-none focus:border-amber-400">
        <option value="">ทุกหมวดหมู่</option>
        <option value="weapon">อาวุธ</option>
        <option value="armor">ชุดเกราะ</option>
        <option value="item">ไอเทมทั่วไป</option>
        <option value="item">ไอเทมอื่นๆ</option>
      </select>
    </div>

    <!-- Item Cards Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      
      <!-- การ์ดไอเทมที่ 1 -->
      <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 hover:border-amber-400 transition-all duration-300">
        <img src="https://static.wikia.nocookie.net/infestation-the-new-z/images/0/0d/Sig_Sauer_556.png/revision/latest?cb=20170117123849&path-prefix=ru"alt="">
        <div class="p-4">
          <span class="text-xs bg-red-900/60 text-red-300 px-2 py-1 rounded">อาวุธ</span>
          <h3 class="text-lg font-semibold mt-2 text-white">SIG SAUER 556</h3>
          
          <div class="flex justify-between items-end mt-4">
            <div>
              <p class="text-xs text-slate-400">ราคากลาง</p>
              <p class="text-xl font-bold text-amber-400">23 ฿</p>
            </div>
            <span class="text-xs text-emerald-400 bg-emerald-950 px-2 py-1 rounded">▲ ขึ้น 5%</span>
          </div>
          
          <div class="mt-4 pt-3 border-t border-slate-700/50 flex justify-between text-xs text-slate-500">
            <span>อัพเดตล่าสุด:</span>
            <span>26 ก.ค. 2026</span>
          </div>
        </div>
      </div>

      <!-- การ์ดไอเทมที่ 2 -->
      <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 hover:border-amber-400 transition-all duration-300">
        <img src="https://via.placeholder.com/300x200?text=Shield+Item" alt="โล่ศักดิ์สิทธิ์" class="w-full h-48 object-cover">
        <div class="p-4">
          <span class="text-xs bg-blue-900/60 text-blue-300 px-2 py-1 rounded">ชุดเกราะ</span>
          <h3 class="text-lg font-semibold mt-2 text-white">โล่ศักดิ์สิทธิ์</h3>
          
          <div class="flex justify-between items-end mt-4">
            <div>
              <p class="text-xs text-slate-400">ราคากลาง</p>
              <p class="text-xl font-bold text-amber-400">850 ฿</p>
            </div>
            <span class="text-xs text-rose-400 bg-rose-950 px-2 py-1 rounded">▼ ลง 2%</span>
          </div>
          
          <div class="mt-4 pt-3 border-t border-slate-700/50 flex justify-between text-xs text-slate-500">
            <span>อัพเดตล่าสุด:</span>
            <span>25 ก.ค. 2026</span>
          </div>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
